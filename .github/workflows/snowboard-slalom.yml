name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Custom Head SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snow-snake.svg?color_snake=https://github.com/ksbn.png&color_dots=#ebedf0,#b6e3f4,#6bc5e8,#2ca0d2,#007bb6
            dist/github-snow-snake-dark.svg?color_snake=https://github.com/ksbn.png&color_dots=#161b22,#1b394a,#2b5c78,#3c83aa,#4eaedc

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
