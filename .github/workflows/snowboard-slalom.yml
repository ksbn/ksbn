name: Generate Snowboard Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs every night at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snowboard Grid SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snowboard-dark.svg?palette=github-dark&color_snake=%F0%9F%8F%82
            dist/github-snowboard-light.svg?palette=github-light&color_snake=%F0%9F%8F%82

      - name: Push SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
